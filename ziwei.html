<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c1d95">
  <title>紫微斗数 - 观象</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page" id="page-ziwei">
  <div class="sub-header">
    <div class="stars-bg" id="stars-ziwei"></div>
    <div class="sub-header-top">
      <button class="back-btn" onclick="goBack()">‹</button>
      <span class="sub-header-title">🔮 紫微斗数</span>
    </div>
  </div>

  <div class="page-container">
    <div class="bazi-form card">
      <label>📅 出生信息（公历）</label>
      <div class="form-row">
        <input type="number" id="ziwei-year" placeholder="如：1995" min="1900" max="2100">
        <span style="color:var(--text-muted);line-height:44px;">年</span>
        <input type="number" id="ziwei-month" placeholder="1-12" min="1" max="12">
        <span style="color:var(--text-muted);line-height:44px;">月</span>
        <input type="number" id="ziwei-day" placeholder="1-31" min="1" max="31">
        <span style="color:var(--text-muted);line-height:44px;">日</span>
      </div>
      <div class="form-row">
        <select id="ziwei-hour" style="flex:1;"></select>
        <select id="ziwei-gender" style="flex:1;">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <label class="form-check">
        <input type="checkbox" id="ziwei-fixleap" checked>
        <span>自动修正闰月（闰月出生建议勾选）</span>
      </label>
      <p class="form-hint">紫微斗数以农历排盘，公历生日会自动换算；时辰按「早子/丑/寅…」十二时辰选择。<br>⚠️ 时辰影响排盘准确度，若不确定可填大概时段（如上午选巳时、下午选申时）</p>
      <button class="bazi-start-btn" onclick="calculateZiwei()">🔮 开始排盘</button>
    </div>

    <div id="ziwei-result">
      <div class="ziwei-meta card" id="ziwei-meta"></div>
      <div class="ziwei-chart card">
        <h4>🌟 十二宫命盘</h4>
        <div class="ziwei-grid" id="ziwei-grid"></div>
        <div class="ziwei-legend">
          <span><i class="lg lg-major"></i>主星</span>
          <span><i class="lg lg-minor"></i>辅星</span>
          <span><i class="lg lg-mutagen"></i>四化</span>
          <span><i class="lg lg-body"></i>身宫</span>
        </div>
      </div>
      <div class="bazi-analysis" id="ziwei-analysis"></div>
      <div id="ziwei-horoscope"></div>
      <div id="ziwei-ai-analysis" style="display:none;"></div>
      <div id="followup-root"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">🏠</span><span>首页</span></div>
    <div class="nav-item" onclick="goTo('zodiac.html')"><span class="nav-icon">⭐</span><span>星座</span></div>
    <div class="nav-item" onclick="goTo('tarot.html')"><span class="nav-icon">🃏</span><span>塔罗</span></div>
    <div class="nav-item" onclick="goTo('dream.html')"><span class="nav-icon">🌙</span><span>解梦</span></div>
    <div class="nav-item active" onclick="openMingliMenu(event)"><span class="nav-icon">☯️</span><span>命理</span></div>
    <div class="nav-item" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span><span>设置</span></div>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/longcat.js"></script>
<script src="js/iztro.min.js"></script>
<script src="js/ziwei.js"></script>
<script src="js/followup.js"></script>
<script src="js/assistant.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
