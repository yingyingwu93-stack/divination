<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c1d95">
  <title>登录 - 占卜平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 380px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
    }
    .auth-logo h1 {
      font-size: 24px;
      color: var(--gold);
      margin: 0;
    }
    .auth-logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-form input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 16px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .auth-form input:focus {
      outline: none;
      border-color: var(--primary-light);
    }
    .auth-form button {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .auth-form button:active {
      opacity: 0.8;
    }
    .auth-message {
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      padding: 8px;
      border-radius: 8px;
    }
    .auth-message.error {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .auth-message.success {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }
    .auth-message.info {
      color: var(--primary-light);
      background: rgba(124, 58, 237, 0.1);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">
      <span class="icon">🔮</span>
      <h1>占卜平台</h1>
      <p>探索命运之谜 · 记录每次占卜</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">登录</div>
      <div class="auth-tab" onclick="switchTab('register')">注册</div>
    </div>

    <div id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="用户名" autocomplete="username">
      <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
      <div id="login-message" class="auth-message"></div>
      <button onclick="handleLogin()">登 录</button>
    </div>

    <div id="register-form" class="auth-form" style="display:none;">
      <input type="text" id="register-username" placeholder="用户名（2-20个字符）" autocomplete="username">
      <input type="password" id="register-password" placeholder="密码（至少6位）" autocomplete="new-password">
      <input type="password" id="register-confirm" placeholder="确认密码" autocomplete="new-password">
      <div id="register-message" class="auth-message"></div>
      <button onclick="handleRegister()">注 册</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function goTo(url) { window.location.href = url; }
  </script>
</body>
</html>
