<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c1d95">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>观象 - 探索命运之谜</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page" id="page-home">
  <div class="header">
    <div class="stars-bg" id="stars-home"></div>
    <div class="header-top">
      <div class="header-logo"><span class="icon">🔮</span>观象</div>
      <span style="font-size:13px;opacity:0.8;">探索命运之谜</span>
    </div>
    <div class="header-subtitle">✨ 星辰指引 · 预知未来 ✨</div>
  </div>

  <div class="page-container my-fortune-wrap">
    <div class="my-fortune-card" id="my-fortune"></div>
  </div>

  <div class="page-container">
    <div class="section-title"><h3>🌟 全部星座今日运势</h3><span class="more" onclick="goTo('zodiac.html')">查看全部 ›</span></div>
    <div class="zodiac-scroll" id="zodiac-scroll"></div>
  </div>

  <div class="page-container">
    <div class="section-title"><h3>📜 最近记录</h3><span class="more" onclick="goTo('history.html')">查看全部 ›</span></div>
    <div class="recent-list" id="recent-list"></div>
  </div>

  <div class="page-container">
    <div class="section-title"><h3>🔮 AI 观象助手</h3><span class="more" onclick="goTo('history.html')">记录 ›</span></div>
    <div class="chat-box" id="chat-box">
      <div class="chat-toolbar"><button onclick="newChat()">＋ 新对话</button></div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg ai"><div class="chat-bubble">你好！我是你的 AI 观象助手 🔮 你可以问我关于感情、运势、人际关系等问题，我会为你提供积极的指引和建议～</div></div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="chat-send-btn" onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">🏠</span><span>首页</span></div>
    <div class="nav-item" onclick="goTo('zodiac.html')"><span class="nav-icon">⭐</span><span>星座</span></div>
    <div class="nav-item" onclick="goTo('tarot.html')"><span class="nav-icon">🃏</span><span>塔罗</span></div>
    <div class="nav-item" onclick="goTo('dream.html')"><span class="nav-icon">🌙</span><span>解梦</span></div>
    <div class="nav-item" onclick="openMingliMenu(event)"><span class="nav-icon">☯️</span><span>命理</span></div>
    <div class="nav-item" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span><span>设置</span></div>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/markdown.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
