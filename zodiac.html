<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c1d95">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>星座分析 - 观象</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page" id="page-zodiac">
  <div class="sub-header">
    <div class="stars-bg" id="stars-zodiac"></div>
    <div class="sub-header-top">
      <button class="back-btn" onclick="goBack()">‹</button>
      <span class="sub-header-title">⭐ 星座分析</span>
    </div>
  </div>

  <div class="page-container">
    <div class="zodiac-selector card">
      <label>📅 选择您的出生日期</label>
      <div class="date-input-row">
        <input type="date" id="birth-date" value="1995-06-15">
        <button class="confirm-btn" bindtap="analyzeZodiac()" onclick="analyzeZodiac()">开始分析</button>
      </div>
    </div>

    <div class="zodiac-result card" id="zodiac-result" style="display:none;">
      <div class="zr-icon" id="zr-icon"></div>
      <div class="zr-name" id="zr-name"></div>
      <div class="zr-date" id="zr-date"></div>
      <div class="zr-elem" id="zr-elem"></div>
    </div>

    <div class="tabs" id="zodiac-tabs">
      <div class="tab active" data-tab="personality">性格特质</div>
      <div class="tab" data-tab="today">今日运势</div>
      <div class="tab" data-tab="week">本周运势</div>
      <div class="tab" data-tab="month">本月运势</div>
      <div class="tab" data-tab="year">今年运势</div>
      <div class="tab" data-tab="love">爱情婚姻</div>
      <div class="tab" data-tab="career">事业财运</div>
    </div>

    <div class="tab-content active" id="tab-personality"></div>
    <div class="tab-content" id="tab-today"></div>
    <div class="tab-content" id="tab-week"></div>
    <div class="tab-content" id="tab-month"></div>
    <div class="tab-content" id="tab-year"></div>
    <div class="tab-content" id="tab-love"></div>
    <div class="tab-content" id="tab-career"></div>

    <div id="zodiac-ai-analysis" style="display:none;"></div>
    <div id="followup-root"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">🏠</span><span>首页</span></div>
    <div class="nav-item active"><span class="nav-icon">⭐</span><span>星座</span></div>
    <div class="nav-item" onclick="goTo('tarot.html')"><span class="nav-icon">🃏</span><span>塔罗</span></div>
    <div class="nav-item" onclick="goTo('dream.html')"><span class="nav-icon">🌙</span><span>解梦</span></div>
    <div class="nav-item" onclick="openMingliMenu(event)"><span class="nav-icon">☯️</span><span>命理</span></div>
    <div class="nav-item" onclick="goTo('settings.html')"><span class="nav-icon">⚙️</span><span>设置</span></div>
  </nav>
</div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/markdown.js"></script>
<script src="js/followup.js"></script>
<script src="js/assistant.js"></script>
<script src="js/pwa.js"></script>
<script>
  requireLogin().then(valid => { if (!valid) throw new Error('需要登录'); });

  // AI 深度分析：由 main.js 在渲染星座详情后调用
  async function aiZodiacAnalysis(zodiac) {
    if (!zodiac) return;
    const dateStr = document.getElementById('birth-date').value || '';
    const aiSection = document.getElementById('zodiac-ai-analysis');
    aiSection.style.display = 'block';
    aiSection.innerHTML = '<div class="loading-text">⭐ 正在生成 AI 深度分析...</div>';
    aiSection.scrollIntoView({ behavior: 'smooth' });

    try {
      let pendingText = '';
      let renderTimer = null;
      const container = document.createElement('div');
      container.className = 'ai-reading';
      aiSection.innerHTML = '';
      aiSection.appendChild(container);

      const doRender = () => {
        container.innerHTML = renderAIContent(pendingText);
        renderTimer = null;
      };

      const result = await streamZodiacAnalysis(
        zodiac.name, dateStr, zodiac.element,
        (fullText) => {
          pendingText = fullText;
          if (!renderTimer) renderTimer = setTimeout(doRender, 250);
        }
      );
      if (renderTimer) { clearTimeout(renderTimer); doRender(); }

      const saved = await HistoryAPI.save(
        '星座',
        JSON.stringify({ sign: zodiac.name, birth_date: dateStr }),
        result
      );
      if (saved.reading_id && typeof initFollowup === 'function') {
        initFollowup(saved.reading_id, {
          system: '你是一位星座分析师。用户正在追问刚才的星座解读，请结合上下文回答，语言生动自然，不要使用 markdown。',
          placeholder: '继续追问这个星座...'
        });
      }
      if (saved.reading_id && typeof Assistant !== 'undefined') {
        Assistant.pushResult({
          type: '星座',
          title: '星座解读完成',
          summary: `${zodiac.name}：${(result || '').slice(0, 70)}`,
          readingId: saved.reading_id
        });
      }
    } catch (error) {
      renderError(
        aiSection,
        `AI 分析失败：${error.message}`,
        "aiZodiacAnalysis(getZodiacByDate(document.getElementById('birth-date').value))"
      );
    }
  }

  initZodiacPage();
</script>
</body>
</html>
